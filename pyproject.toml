[project]
name = "gguf-forge-rocm"
version = "0.1.0"
description = "GGUF Forge - AMD ROCm version for model conversion"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aioodbc>=0.5.0",
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "cmake>=4.2.1",
    "fastapi>=0.128.0",
    "hf-transfer>=0.1.9",
    "hf-xet>=1.2.0",
    "httpx>=0.28.1",
    "huggingface-hub>=0.36.0",
    "jinja2>=3.1.6",
    "passlib>=1.7.4",
    "protobuf>=6.33.2",
    "psutil>=7.2.1",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "sentencepiece>=0.2.1",
    "torch>=2.10.0a0",
    "torchaudio>=2.8.0a0",
    "torchvision>=0.25.0a0",
    "transformers>=4.57.3",
    "uvicorn[standard]>=0.40.0",
]

[[tool.uv.index]]
name = "rocm"
url = "https://rocm.nightlies.amd.com/v2/gfx1151/"
default = false
prerelease = true

[tool.uv]
package = false
